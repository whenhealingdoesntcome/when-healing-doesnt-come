<!doctype html><meta charset="utf-8"><title>Local video test fixture</title><h1>Local video test fixture</h1><p>Generates a two-second landscape video with a tone for local upload/export testing.</p><button id="make">Generate test video</button><p id="status" role="status"></p><canvas id="canvas" width="640" height="360"></canvas><p><label>Inspect exported video <input id="verify" type="file" accept="video/*"></label></p><video id="check" controls playsinline style="width:324px;height:405px;background:#eee"></video><script>
document.getElementById("verify").onchange=e=>{const v=document.getElementById("check");v.src=URL.createObjectURL(e.target.files[0]);v.onloadedmetadata=()=>{v.currentTime=.5;document.getElementById("status").textContent="Export dimensions: "+v.videoWidth+" × "+v.videoHeight;};};
document.getElementById('make').onclick=async()=>{
 const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),audio=new AudioContext();await audio.resume();const dest=audio.createMediaStreamDestination(),osc=audio.createOscillator();osc.frequency.value=220;osc.connect(dest);osc.start();
 const stream=canvas.captureStream(25);stream.addTrack(dest.stream.getAudioTracks()[0]);const mime=['video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(type=>MediaRecorder.isTypeSupported(type)),rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download='whdc-video-test.'+(mime.startsWith('video/mp4')?'mp4':'webm');a.click();document.getElementById('status').textContent='Test video ready';stream.getTracks().forEach(t=>t.stop());osc.stop();audio.close();};
 let start=performance.now();const draw=now=>{ctx.fillStyle='#243e66';ctx.fillRect(0,0,640,360);ctx.fillStyle='#ffd479';ctx.beginPath();ctx.arc(100+(now-start)/5,180,55,0,2*Math.PI);ctx.fill();ctx.fillStyle='white';ctx.font='32px Arial';ctx.fillText('WHDC VIDEO TEST',130,75);if(now-start<2000)requestAnimationFrame(draw);else rec.stop();};rec.start();requestAnimationFrame(draw);
};
</script>
